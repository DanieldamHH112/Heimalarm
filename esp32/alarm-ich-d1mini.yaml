# Heimalarm – Wemos D1 mini (ESP8266) an der Ladeschale (Motorola TPG2200)
# Verdrahtung: Relais Pol A -> D5 (GPIO14), Pol B -> G (GND). Interner Pull-up, kein Widerstand nötig.
# Flashen: https://web.esphome.io (Chrome/Edge) oder ESPHome-Dashboard.
# Für weitere Personen Datei kopieren und "ich" überall durch die eigene Kennung ersetzen.

substitutions:
  kennung: ich

esphome:
  name: alarm-${kennung}

esp8266:
  board: d1_mini

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pw

http_request:
  verify_ssl: false   # ESP8266 kann keine Zertifikate prüfen; Updates kommen ohnehin per http aus dem Heimnetz

ota:
  - platform: esphome          # Update per ESPHome/Browser
    password: !secret ota_pw
  - platform: http_request     # A10 – Update aus der App (Datei im Heimnetz)

# MQTT statt api: (sonst startet das Gerät regelmäßig neu, weil kein API-Client verbindet)
mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_user
  password: !secret mqtt_pw
  topic_prefix: alarm/${kennung}   # Status "online"/"offline" unter alarm/<kennung>/status
  on_message:
    # A10 – App sendet "<url>|<md5>" an alarm/<kennung>/ota
    - topic: alarm/${kennung}/ota
      then:
        - ota.http_request.flash:
            url: !lambda 'return x.substr(0, x.find("|"));'
            md5: !lambda 'return x.substr(x.find("|") + 1);'

# A3 – Mindestdauer des Kontakts, aus der App einstellbar (alarm/<kennung>/number/min_duration/command)
number:
  - platform: template
    name: "Min Duration"
    id: min_duration
    optimistic: true
    restore_value: true
    initial_value: 50
    min_value: 10
    max_value: 5000
    step: 10
    unit_of_measurement: ms

binary_sensor:
  - platform: gpio
    name: "Melder Alarm"
    pin:
      number: GPIO14
      mode: { input: true, pullup: true }
      inverted: true               # Kontakt geschlossen = Alarm = ON
    filters:
      - delayed_on: !lambda 'return (uint32_t) id(min_duration).state;'   # Entprellen / Mindestdauer
    on_press:
      - mqtt.publish:
          topic: alarm/${kennung}
          payload: "ALARM"
          qos: 1

# Infos für die Übersicht der App (WLAN-Signal, Laufzeit, IP, Firmware)
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
  - platform: version
    name: "Version"
    hide_timestamp: true
