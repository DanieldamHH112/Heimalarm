# Heimalarm – Zentrale (z. B. Raspberry Pi)
# Start:  docker compose up -d
# Zigbee2MQTT ist vorbereitet und startet erst, wenn der USB-Stick eingetragen ist (siehe unten).

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"   # ESP32
      - "9001:9001"   # App (WebSocket)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data

