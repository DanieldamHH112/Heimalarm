# Heimalarm – Zentrale (z. B. Raspberry Pi oder UGREEN-NAS)
# Start ohne Zigbee:  docker compose up -d
# Start mit Zigbee:   docker compose --profile zigbee up -d   (USB-Stick unten eintragen)
# Licht für Alexa / Google Home zusätzlich:  docker compose --profile zigbee --profile matter up -d
# Tuya-Brücke (Melder über Smart Life, ohne ESP32):  docker compose --profile tuya up -d
#   Ohne Kommandozeile (z. B. UGOS-Docker-App): Datei .env neben dieser Datei mit COMPOSE_PROFILES=tuya

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"   # ESP32, Dienst
      - "9001:9001"   # App (WebSocket)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data

  dienst:
    build: ./dienst
    restart: unless-stopped
    network_mode: host   # für Wake-on-LAN und Matter (mDNS im Heimnetz)
    environment:
      MQTT_URL: mqtt://127.0.0.1:1883
      WEBHOOK_PORT: "8080"
      MATTER_PORT: "5541"               # Alarm-Sensoren für Alexa / Google Home
      MATTER_STORAGE: /app/data/matter  # Kopplungen bleiben bei Updates erhalten
      TZ: Europe/Berlin
    volumes:
      - ./dienst/data:/app/data
    depends_on: [mosquitto]

  # Übergang ohne ESP32: liest den Tuya-Kontakt (Funkhandel-Alarmschalter) über Smart Life mit
  # und meldet "ALARM" auf alarm/<KENNUNG> – wie der ESP32. Anmelden: http://<zentrale>:8082
  tuya-bruecke:
    build: ./tuya-bruecke
    profiles: ["tuya"]
    restart: unless-stopped
    depends_on: [mosquitto]
    ports:
      - "8082:8082"   # Weboberfläche (Anmeldung per QR-Code)
    volumes:
      - ./tuya-bruecke/data:/data
    environment:
      TZ: Europe/Berlin
      MQTT_HOST: mosquitto
      KENNUNG: ich            # gleiche Kennung wie in der App („Meine Kennung“)
      ALARM_BEI: geschlossen  # Zustand des Kontakts bei Alarm (geschlossen | offen)
      GERAET: ""              # leer = erster Kontaktsensor, sonst Name oder ID aus Smart Life

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2
    profiles: ["zigbee"]
    restart: unless-stopped
    depends_on: [mosquitto]
    ports:
      - "8081:8080"   # Zigbee2MQTT-Weboberfläche (optional)
    volumes:
      - ./zigbee2mqtt:/app/data
    devices:
      - /dev/ttyUSB0:/dev/ttyACM0   # links: Pfad des Zigbee-Sticks anpassen
    environment:
      TZ: Europe/Berlin
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto:1883
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/ttyACM0
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
      ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED: "false"

  # Gibt Zigbee-Lichter und -Gruppen per Matter an Alexa / Google Home weiter (lokal).
  # Koppeln: Weboberfläche http://<zentrale>:8283 → QR-Code in der Alexa- bzw. Google-Home-App scannen.
  matterbridge:
    image: luligu/matterbridge:latest
    profiles: ["matter"]
    restart: unless-stopped
    network_mode: host   # Matter braucht mDNS im Heimnetz
    stop_grace_period: 60s
    volumes:
      - ./matterbridge/plugins:/root/Matterbridge
      - ./matterbridge/storage:/root/.matterbridge
      - ./matterbridge/cert:/root/.mattercert
    environment:
      TZ: Europe/Berlin
