# Heimalarm – Mosquitto
persistence true
persistence_location /mosquitto/data/

# ESP32
listener 1883

# App (Handy/PC) über WebSocket
listener 9001
protocol websockets

# Für den Start ohne Passwort im Heimnetz. Für Benutzer/Passwort:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
allow_anonymous true
