# Release: baut Windows-Installer und Android-APK, wenn ein Tag v* gepusht wird.
# Bewusst schlank: keine Tests, kein Linting – damit Bugfix-Releases schnell gehen.
# Normale Commits/Pushes lösen nichts aus.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version für den Release (z. B. v0.1.0). Leer = nur bauen, kein Release."
        required: false
        default: ""

permissions:
  contents: write

# Neuer Start bricht einen noch laufenden Build ab – spart Wartezeit bei schnellen Bugfixes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri, cache-on-failure: true }
      - run: npm ci --no-audit --no-fund
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri, cache-on-failure: true }
      # Gradle-Abhängigkeiten zwischenspeichern (spart beim Android-Build Minuten)
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/plugins/heimalarm/android/build.gradle.kts', 'app/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci --no-audit --no-fund
      - name: Android-Projekt erzeugen
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"   # auf dem Runner vorinstalliert
          npx tauri android init --ci
          # Eigene Launcher-Symbole (Logo, adaptiv) statt automatisch erzeugter
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
      - name: APK bauen (nur arm64, Debug-signiert)
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"   # auf dem Runner vorinstalliert
          npx tauri android build --apk --debug --target aarch64
      - run: find src-tauri/gen/android -name "*.apk" -path "*debug*" -exec cp {} "Heimalarm-${VERSION}.apk" \; -quit
        env: { VERSION: "${{ inputs.version || github.ref_name }}" }
      - uses: actions/upload-artifact@v7
        with: { name: android, path: "app/Heimalarm-*.apk" }

  release:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
