# Release: baut Windows-Installer und Android-APK, wenn ein Tag v* gepusht wird.
# Bewusst schlank: keine Tests, kein Linting – damit Bugfix-Releases schnell gehen.
# Normale Commits/Pushes lösen nichts aus.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;${NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - run: npm ci
      - name: Android-Projekt erzeugen
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/icon.png
      - name: APK bauen (nur arm64, Debug-signiert)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --apk --debug --target aarch64
      - run: find src-tauri/gen/android -name "*.apk" -path "*debug*" -exec cp {} "Heimalarm-${GITHUB_REF_NAME}.apk" \; -quit
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "app/Heimalarm-*.apk" }

  release:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
